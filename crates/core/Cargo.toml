[package]
name = "mincorr"
description = "Fast correlation matrices: Pearson, Spearman, Kendall tau-b, biweight midcorrelation and Hellinger correlation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/mincorr"
license.workspace = true
readme = "../../README.md"
keywords = ["correlation", "statistics", "kendall", "spearman", "bicor"]
categories = ["science", "mathematics", "algorithms"]
exclude = ["tests/props.proptest-regressions"]

[lib]
path = "src/lib.rs"

[features]
default = []
## Link a system BLAS through ndarray for the Gram (matrix-product) kernel.
blas = ["ndarray/blas"]

[dependencies]
ndarray = { workspace = true, features = ["rayon"] }
rayon.workspace = true
thiserror.workspace = true
rand_chacha.workspace = true

[dev-dependencies]
rayon.workspace = true
proptest.workspace = true
criterion.workspace = true

[[bench]]
name = "methods"
harness = false

[lints]
workspace = true
