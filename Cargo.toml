[package]
name = "mincorr"
description = "Fast correlation matrices (Pearson, Spearman, Kendall tau-b, biweight midcorrelation, Hellinger correlation): library and CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/mincorr"
license.workspace = true
readme = "README.md"
keywords = ["correlation", "statistics", "kendall", "bicor", "co-expression"]
categories = ["science", "mathematics", "algorithms", "command-line-utilities"]
include = [
  "src/**",
  "tests/*.rs",
  "tests/common/**",
  "tests/fixtures/**",
  "benches/**",
  "examples/*.rs",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
]

[package.metadata.docs.rs]
# Library documentation only; the CLI is documented by `mincorr --help`.
no-default-features = true

[features]
default = ["cli"]
## The `mincorr` command-line tool (disable with `default-features = false`
## when only the library is needed).
cli = ["dep:clap", "dep:flate2", "dep:tar", "dep:anyhow", "dep:ryu"]
## Link a system BLAS through ndarray for the Gram (matrix-product) kernel.
blas = ["ndarray/blas"]

[[bin]]
name = "mincorr"
path = "src/bin/mincorr/main.rs"
required-features = ["cli"]
doc = false

[[test]]
name = "cli"
required-features = ["cli"]

[[bench]]
name = "methods"
harness = false

[dependencies]
ndarray = { workspace = true, features = ["rayon"] }
rayon.workspace = true
thiserror.workspace = true
rand_chacha.workspace = true
clap = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
ryu = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[workspace]
members = [".", "python"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
authors = ["Denis Demin"]
repository = "https://github.com/deminden/min-rust-corr"
homepage = "https://github.com/deminden/min-rust-corr"
license = "MIT"

[workspace.dependencies]
mincorr = { path = ".", version = "0.3.0", default-features = false }
ndarray = { version = "0.17.2", default-features = false, features = ["std"] }
rayon = "1.12"
thiserror = "2.0.21"
rand_chacha = { version = "0.10", default-features = false }
clap = { version = "4.6.10", features = ["derive"] }
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
tar = "0.4.46"
anyhow = "1.0.105"
ryu = "1.0.23"
pyo3 = { version = "0.30.1", features = ["abi3-py39"] }
numpy = "0.30"
proptest = "1.12"
criterion = { version = "0.8.2", default-features = false }
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
# NaN-aware `!(x > 0.0)` comparisons are deliberate.
neg_cmp_op_on_partial_ord = "allow"
# Published constants are kept verbatim.
excessive_precision = "allow"
# Index loops read more clearly in the numerical kernels.
needless_range_loop = "allow"
# Function length cap (threshold in clippy.toml).
too_many_lines = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "thin"
codegen-units = 1
