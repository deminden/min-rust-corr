[workspace]
members = ["crates/core", "crates/cli", "crates/py"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
authors = ["Denis Demin"]
repository = "https://github.com/deminden/min-rust-corr"
homepage = "https://github.com/deminden/min-rust-corr"
license = "MIT"

[workspace.dependencies]
mincorr = { path = "crates/core", version = "0.3.0" }
ndarray = { version = "0.17", default-features = false, features = ["std"] }
rayon = "1.11"
thiserror = "2"
rand = { version = "0.10", default-features = false }
rand_chacha = { version = "0.10", default-features = false }
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
tar = "0.4"
anyhow = "1"
ryu = "1"
pyo3 = { version = "0.27", features = ["abi3-py39"] }
numpy = "0.27"
proptest = "1"
criterion = { version = "0.7", default-features = false }
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
# NaN-aware `!(x > 0.0)` comparisons are deliberate.
neg_cmp_op_on_partial_ord = "allow"
# Published constants are kept verbatim.
excessive_precision = "allow"
# Index loops read more clearly in the numerical kernels.
needless_range_loop = "allow"
# Function length cap (threshold in clippy.toml).
too_many_lines = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "thin"
codegen-units = 1
