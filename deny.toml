# cargo-deny configuration: permissive licences only, no GPL-family code.
[graph]
all-features = false

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
deny = [{ name = "kendalls" }, { name = "statrs" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
