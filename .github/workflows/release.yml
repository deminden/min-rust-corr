# Release pipeline, started by pushing a version tag (vX.Y.Z):
#   1. verify  - tag matches Cargo.toml, lint, test, crates.io dry run
#   2. build   - CLI binaries for Linux / macOS / Windows and Python wheels
#   3. release - GitHub Release with binaries, wheels, SHA256SUMS and the
#                CHANGELOG section as release notes
#   4. publish - crates.io (secret CARGO_REGISTRY_TOKEN) and, when the
#                repository variable PUBLISH_PYPI is "true", PyPI via trusted
#                publishing (environment "pypi")
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Tag matches the crate version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "mincorr") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --exclude mincorr-py --locked
      - run: cargo publish --dry-run --locked

  binaries:
    name: binary (${{ matrix.target }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --bin mincorr --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="mincorr-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          exe=""; [[ "${{ matrix.target }}" == *windows* ]] && exe=".exe"
          cp "target/${{ matrix.target }}/release/mincorr$exe" README.md LICENSE CHANGELOG.md "dist/$name/"
          cd dist
          if [[ -n "$exe" ]]; then 7z a -tzip "$name.zip" "$name" > /dev/null; else tar czf "$name.tar.gz" "$name"; fi
          rm -r "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: dist/*

  wheels:
    name: wheels (${{ matrix.os }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          command: build
          args: --release --locked --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: python/dist/*

  sdist:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: python/dist/*

  release:
    needs: [verify, binaries, wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${{ needs.verify.outputs.version }}" '
            /^## / { if (found) exit; if (index($0, "## " v) == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "mincorr ${{ needs.verify.outputs.version }}" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: mincorr ${{ needs.verify.outputs.version }}
          body_path: notes.md
          files: dist/*
          fail_on_unmatched_files: true

  crates-io:
    needs: [verify, release]
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish unless this version already exists
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -A "mincorr-release-workflow" \
            "https://crates.io/api/v1/crates/mincorr/$VERSION")
          if [ "$status" = "200" ]; then echo "mincorr $VERSION is already on crates.io"; exit 0; fi
          cargo publish --locked

  pypi:
    needs: release
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
